name: Deploy to GitHub Pages
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_DIR: dist

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate Fiat guide language pages and SEO
        run: |
          node scripts/build-fiat500l-locales.mjs --check
          node scripts/check-fiat500l-seo.mjs
          node --check assets/js/fiat500l-guide.js

      - name: Validate fitness section
        run: |
          node --test tests/fitness/*.test.mjs
          node scripts/check-fitness.mjs

      - name: Create deployment directory 📁
        run: |
          mkdir -p $DEPLOY_DIR
          cp *.html $DEPLOY_DIR/
          cp *.js $DEPLOY_DIR/
          cp -r css $DEPLOY_DIR/
          cp -r assets $DEPLOY_DIR/
          mkdir -p $DEPLOY_DIR/docs
          cp docs/fitness.md docs/fitness-media.md docs/fitness-video-sources.md $DEPLOY_DIR/docs/
          cp -r public/. $DEPLOY_DIR/
          cp -r fiat500L-photos $DEPLOY_DIR/
          # advertising files
          # https://www.bing.com/webmasters
          cp BingSiteAuth.xml $DEPLOY_DIR/

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: ${{ env.DEPLOY_DIR }}
          force: true
